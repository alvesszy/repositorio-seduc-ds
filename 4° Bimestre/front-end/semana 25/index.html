<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galeria de imagens otimizada com performance avançada e lazy loading.">
  <title>Lazy Loading com Animações e SEO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Galeria de Imagens com Lazy Loading</h1>
  </header>
  <main>
    <div class="gallery">
      <img data-src="imagens/imagem1.jpg" src="imagens/imagem1.jpg" alt="Fotografia de paisagem natural" class="lazy" loading="lazy">
      <img data-src="imagens/imagem2.jpg" src="imagens/imagem2.jpg" alt="Fotografia de arquitetura urbana" class="lazy" loading="lazy">
    </div>
  </main>
  <script src="js/lazyload.js"></script>
</body>
</html>
